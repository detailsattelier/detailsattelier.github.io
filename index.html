<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De'tails Attelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { cream: '#F9F5F0', warm: '#E8DED2', cocoa: '#8B7355', dark: '#2C231B', accent: '#C89F73' },
                    fontFamily: { display: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .music-btn {position:fixed;top:70px;right:20px;background:rgba(249,245,240,0.9);border:1px solid #C89F73;color:#8B7355;padding:0.6rem 1rem;border-radius:50px;z-index:999;}
        .music-btn:hover {background:#C89F73;color:white;}
        .pattern-dot {background-image:radial-gradient(#E8DED2 1px,transparent 1px);background-size:20px 20px;}
        .card-hover {transition:0.3s;}
        .card-hover:hover {transform:translateY(-5px);box-shadow:0 10px 25px rgba(139,115,85,0.15);}
    </style>
</head>
<body class="bg-cream text-dark font-sans">
    <button class="music-btn" id="musicToggle">🔊 Nyalakan Musik</button>
    <audio id="bgMusic" loop preload="auto"><source src="fairytale-musik.mp3" type="audio/mpeg">

    <nav class="fixed top-0 left-0 w-full bg-cream/90 backdrop-blur-sm z-50 border-b border-warm/50">
        <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
            <a href="#beranda" class="flex items-center gap-2">
                <img src="da-logo.png" alt="Logo" class="h-7">
                <span class="font-display font-semibold">De'tails Attelier</span>
            </a>
            <div class="hidden md:flex gap-6 text-sm">
                <a href="#beranda" class="hover:text-cocoa">Beranda</a>
                <a href="#tentang" class="hover:text-cocoa">Tentang</a>
                <a href="#karya" class="hover:text-cocoa">Karya</a>
                <a href="#hubungi" class="hover:text-cocoa">Hubungi</a>
            </div>
        </div>
    </nav>

    <section id="beranda" class="pt-28 pb-16 px-4 pattern-dot">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="font-display text-4xl font-semibold mb-5">Setiap detail menceritakan kisah</h1>
            <p class="mb-6 text-lg">Selamat datang di De'tails Attelier — tempat ide lahir dari goresan tulus 🤎</p>
            <a href="#karya" class="inline-block bg-cocoa text-white px-8 py-3 rounded-full hover:bg-accent">Lihat Karya Saya →</a>
        </div>
    </section>

    <section id="tentang" class="py-16 px-4 bg-white">
        <div class="max-w-2xl mx-auto text-center">
            <h2 class="font-display text-2xl font-semibold mb-4">Tentang Saya</h2>
            <p class="mb-3">Hai! Saya Stefen — bermimpi menjadi ikon fashion yang dikenal banyak orang ✨</p>
            <p>Semua karya dibuat dengan tulus menggunakan <strong>Ibis Paint</strong> di HP 🖌️</p>
        </div>
    </section>

    <section id="karya" class="py-16 px-4">
        <div class="max-w-6xl mx-auto">
            <h2 class="font-display text-2xl font-semibold text-center mb-10">Karya & Sketsa</h2>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl p-4 card-hover">
                    <img src="black-butterfly.png" alt="Black Butterfly" class="w-full h-64 object-cover rounded-lg mb-3">
                    <h3 class="font-semibold">Black Butterfly 🦋</h3>
                    <p class="text-sm text-gray-600">Anggun, misterius, penuh keindahan.</p>
                </div>
                <div class="bg-white rounded-xl p-4 card-hover">
                    <img src="starry-night.png" alt="Starry Night" class="w-full h-64 object-cover rounded-lg mb-3">
                    <h3 class="font-semibold">Starry Night 🌙</h3>
                    <p class="text-sm text-gray-600">Langit malam yang bercerita.</p>
                </div>
                <div class="bg-white rounded-xl p-4 card-hover">
                    <img src="island-girl.png" alt="Island Girl" class="w-full h-64 object-cover rounded-lg mb-3">
                    <h3 class="font-semibold">Island Girl 🏝️</h3>
                    <p class="text-sm text-gray-600">Keindahan alami yang mempesona.</p>
                </div>
            </div>
        </div>
    </section>

    <section id="hubungi" class="py-16 px-4 bg-dark text-white">
        <div class="max-w-xl mx-auto text-center">
            <h2 class="font-display text-2xl font-semibold mb-4">Ikuti Perjalananku</h2>
            <p class="text-gray-300 mb-6">Setiap karya baru adalah langkah lebih dekat ke mimpi ✨</p>
            <div class="flex justify-center gap-4 mb-6">
                <a href="https://instagram.com/detailsattelier" target="_blank" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-cocoa"><i class="fa fa-instagram"></i></a>
                <a href="https://pin.it/2TqFqCe9A" target="_blank" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-cocoa"><i class="fa fa-pinterest"></i></a>
                <a href="https://x.com/detailsattelier" target="_blank" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-cocoa"><i class="fa fa-twitter"></i></a>
            </div>
            <p class="text-sm text-gray-300 mb-2">Hubungi saya ✉️</p>
            <a href="mailto:detailssattelier@gmail.com" class="text-accent font-medium">detailssattelier@gmail.com</a>
            <p class="mt-6 text-xs text-gray-400">Dibuat dengan tulus oleh De'tails Attelier 🤎<br>"Setiap detail menceritakan kisah."</p>
        </div>
    </section>

    <script>
        const music = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('musicToggle');
        let isPlaying = false;
        toggleBtn.addEventListener('click', () => {
            if(isPlaying) { music.pause(); toggleBtn.textContent='🔊 Nyalakan Musik'; }
            else { music.play(); toggleBtn.textContent='🔇 Matikan Musik'; }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>
