<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De'tails Attelier</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Konfigurasi Warna & Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F9F5F0',
                        warm: '#E8DED2',
                        cocoa: '#8B7355',
                        dark: '#2C231B',
                        accent: '#C89F73'
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .pattern-dot {
                background-image: radial-gradient(#E8DED2 1px, transparent 1px);
                background-size: 20px 20px;
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(139, 115, 85, 0.15);
            }
        }
    </style>
    
    <style>
        /* Tombol Musik */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(249, 245, 240, 0.9);
            border: 1px solid #C89F73;
            color: #8B7355;
            padding: 0.6rem 1rem;
            border-radius: 50px;
            z-index: 9999;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .music-btn:hover {
            background: #C89F73;
            color: white;
        }
    </style>
</head>
<body class="bg-cream text-dark font-sans">

    <!-- Musik Latar -->
    <audio id="bgMusic" loop preload="auto">
        <source src="fairytale-musik.mp3" type="audio/mpeg">
        Browser tidak mendukung pemutar musik.
    

    <!-- Tombol Musik -->
    <button class="music-btn" id="musicToggle">🔊 Nyalakan Musik</button>

    <!-- Navigasi -->
    <nav class="fixed top-0 left-0 w-full bg-cream/90 backdrop-blur-sm z-50 border-b border-warm/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
            <a href="#beranda" class="flex items-center gap-2">
                <img src="da-logo.png" alt="DA Logo" class="h-8 w-auto">
                <span class="font-display font-semibold text-lg">De'tails Attelier</span>
            </a>
            <div class="hidden md:flex gap-6 text-sm tracking-wide">
                <a href="#beranda" class="hover:text-cocoa transition-colors">Beranda</a>
                <a href="#tentang" class="hover:text-cocoa transition-colors">Tentang</a>
                <a href="#karya" class="hover:text-cocoa transition-colors">Karya</a>
                <a href="#hubungi" class="hover:text-cocoa transition-colors">Hubungi</a>
            </div>
        </div>
    </nav>

    <!-- Bagian Beranda -->
    <section id="beranda" class="pt-32 pb-20 px-4 pattern-dot min-h-screen flex items-center">
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-10 items-center">
            <div>
                <h1 class="font-display text-[clamp(2rem,5vw,3.5rem)] leading-tight font-semibold mb-6">
                    Setiap detail<br>
                    <span class="text-cocoa">menceritakan kisah</span>
                </h1>
                <p class="text-lg mb-8 max-w-lg leading-relaxed">
                    Selamat datang di De'tails Attelier — tempat ide lahir dari goresan tulus di Ibis Paint 🤎
                </p>
                <a href="#karya" class="inline-block bg-cocoa text-white px-8 py-3 rounded-full hover:bg-accent transition-colors shadow-lg">
                    Lihat Karya Saya <i class="fa fa-arrow-right ml-2"></i>
                </a>
            </div>
            <div class="flex justify-center">
                <div class="w-full max-w-sm aspect-square rounded-full bg-warm/30 flex items-center justify-center">
                    <img src="da-logo.png" alt="De'tails Attelier" class="w-3/4 h-auto">
                </div>
            </div>
        </div>
    </section>

    <!-- Bagian Tentang -->
    <section id="tentang" class="py-20 px-4 bg-white">
        <div class="max-w-3xl mx-auto text-center">
            <h2 class="font-display text-2xl font-semibold mb-4">Tentang De'tails Attelier</h2>
            <div class="w-16 h-0.5 bg-accent mx-auto mb-6"></div>
            <p class="mb-4 text-lg leading-relaxed">
                Hai! Saya Stefen — seseorang yang memiliki impian besar untuk menjadi ikon fashion yang dikenal banyak orang. Perjalanan ini dimulai dari sini.
            </p>
            <p class="mb-4 text-lg leading-relaxed">
                Semua karya di sini dibuat dengan tulus menggunakan <strong>Ibis Paint</strong> di HP 🖌️ Tidak butuh alat mahal untuk berkarya — yang dibutuhkan hanya hati, ketekunan, dan imajinasi ✨
            </p>
            <p class="text-lg italic text-cocoa">
                "Setiap detail menceritakan kisah."
            </p>
        </div>
    </section>

    <!-- Bagian Karya -->
    <section id="karya" class="py-20 px-4">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-12">

                <p class="text-dark/60 max-w-xl mx-auto">Dibuat dengan tulus di Ibis Paint 🤍</p>
                <div class="w-16 h-0.5 bg-accent mx-auto mt-4"></div>
            </div>
            
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Karya 1 -->
                <div class="bg-white rounded-xl overflow-hidden shadow-md card-hover">
                    <div class="aspect-square bg-warm/30 flex items-center justify-center">
                        <img src="black-butterfly.png" alt="Black Butterfly" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-lg mb-2">Black Butterfly 🦋</h3>
                        <p class="text-sm text-dark/60 mb-3">Terinspirasi dari keindahan sayap kupu-kupu hitam — anggun, misterius, penuh keindahan.</p>
                        <span class="text-xs bg-cream px-3 py-1 rounded-full text-cocoa">Ibis Paint</span>
                    </div>
                </div>

                <!-- Karya 2 -->
                <div class="bg-white rounded-xl overflow-hidden shadow-md card-hover">
                    <div class="aspect-square bg-warm/30 flex items-center justify-center">
                        <img src="starry-night.png" alt="Starry Night" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-lg mb-2">Starry Night 🌙</h3>
                        <p class="text-sm text-dark/60 mb-3">Terinspirasi dari langit malam yang berkilauan — setiap bintang memiliki ceritanya sendiri.</p>
                        <span class="text-xs bg-cream px-3 py-1 rounded-full text-cocoa">Ibis Paint</span>
                    </div>
                </div>

                <!-- Karya 3 -->
                <div class="bg-white rounded-xl overflow-hidden shadow-md card-hover">
                    <div class="aspect-square bg-warm/30 flex items-center justify-center">
                        <img src="island-girl.png" alt="Island Girl" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-lg mb-2">Island Girl 🏝️</h3>
                        <p class="text-sm text-dark/60 mb-3">Terinspirasi dari keindahan alami — hangat, eksotis, mempesona seperti pulau yang damai.</p>
                        <span class="text-xs bg-cream px-3 py-1 rounded-full text-cocoa">Ibis Paint</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bagian Hubungi -->
    <section id="hubungi" class="py-20 px-4 bg-dark text-white">
        <div class="max-w-2xl mx-auto text-center">
            <h2 class="font-display text-2xl font-semibold mb-4">Ikuti Perjalananku</h2>
            <p class="text-gray-300 mb-8">Terus berkarya bersama — setiap karya baru adalah langkah lebih dekat ke mimpi ✨</p>
            
            <div class="flex justify-center gap-5 mb-8">
                <a href="https://instagram.com/detailsattelier" target="_blank" class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center hover:bg-cocoa transition-colors text-lg">
                    <i class="fa fa-instagram"></i>
                </a>
                <a href="https://pin.it/2TqFqCe9A" target="_blank" class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center hover:bg-cocoa transition-colors text-lg">
                    <i class="fa fa-pinterest"></i>
                </a>
                <a href="https://x.com/detailsattelier" target="_blank" class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center hover:bg-cocoa transition-colors text-lg">
                    <i class="fa fa-twitter"></i>
                </a>
            </div>
            
            <div class="mb-6">
                <p class="text-sm text-gray-300 mb-2">Hubungi saya untuk kerja sama atau pesan ✉️</p>
                <a href="mailto:detailssattelier@gmail.com" class="text-accent hover:text-white transition-colors font-medium text-lg">
                    detailssattelier@gmail.com
                </a>
            </div>
            
            <p class="text-sm text-gray-400 mt-8">Dibuat dengan tulus oleh De'tails Attelier 🤎<br>"Setiap detail menceritakan kisah."</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark/90 text-white/60 py-4 text-center text-sm">
        <p>© 2026 De'tails Attelier — Semua karya dibuat dengan Ibis Paint 🖌️</p>
    </footer>

    <!-- Script Musik -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const music = document.getElementById('bgMusic');
            const toggleBtn = document.getElementById('musicToggle');
            let isPlaying = false;

            if (music) {
                music.volume = 0.25;
            }

            if (toggleBtn && music) {
                toggleBtn.addEventListener('click', function() {
                    if (isPlaying) {
                        music.pause();
                        toggleBtn.textContent = '🔊 Nyalakan Musik';
                    } else {
                        music.play().catch(function() {
                            alert('Klik tombol sekali lagi untuk memutar musik');
                        });
                        toggleBtn.textContent = '🔇 Matikan Musik';
                    }
                    isPlaying = !isPlaying;
                });
            }
        });
    </script>

</body>
</html>
